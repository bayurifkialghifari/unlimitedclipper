[package]
name = "unlimitedclipper-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
anyhow = "1"
base64 = "0.22"
axum = { version = "0.8", features = ["multipart"] }
async-stream = "0.3"
bytes = "1"
directories = "6"
futures-util = "0.3"
hex = "0.4"
http = "1"
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "load-dynamic", "api-30"] }
minisign-verify = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "migrate"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
ttf-parser = "0.25"
hound = "3.5"
rustfft = "6.4"
tower-http = { version = "0.6", features = ["fs", "cors", "trace", "limit"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = { version = "5", features = ["axum_extras"] }
uuid = { version = "1", features = ["v4", "v5", "serde"] }
zip = { version = "4", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
