[package]
name = "tauri-plugin-native-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
links = "tauri-plugin-native-media"

[build-dependencies]
tauri-plugin = { version = "2.7.2", features = ["build"] }

[target.'cfg(target_os = "android")'.dependencies]
tauri = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["sync"] }
tokio-util = "0.7"
uuid = { version = "1", features = ["v4"] }
unlimitedclipper-engine = { path = "../engine" }
