name: Quality checks

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  pull_request:
    paths-ignore: ['**/*.md']
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  studio:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check

  engine:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15-intel, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo test --locked -p unlimitedclipper-engine
      - run: cargo clippy --locked -p unlimitedclipper-engine --all-targets -- -D warnings
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        if: runner.os == 'Windows'
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
        if: runner.os == 'Windows'
      - run: npm run build
        if: runner.os == 'Windows'
      - run: cargo clippy --locked -p unlimitedclipper-desktop --all-targets -- -D warnings
        if: runner.os == 'Windows'
