name: Tagged multi-platform preview

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  actions: read

jobs:
  validate:
    uses: ./.github/workflows/ci.yml

  windows:
    needs: validate
    runs-on: windows-2025
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            target: x86_64-pc-windows-msvc
            compiler: amd64
          - arch: arm64
            target: aarch64-pc-windows-msvc
            compiler: amd64_arm64
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_BUILD_TARGET: ${{ matrix.target }}
      UC_TARGET: ${{ matrix.target }}
      UC_USE_MSVC: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756
        with:
          arch: ${{ matrix.compiler }}
      - name: Validate publisher signing configuration
        env:
          UC_APP_PUBLIC_KEY: ${{ secrets.APP_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.APP_UPDATE_PRIVATE_KEY }}
        run: node scripts/set-release-version.mjs
      - run: npm install --package-lock-only --ignore-scripts
      - run: cargo update --workspace
      - run: npm ci
      - run: node scripts/setup-tools.mjs --arch=${{ matrix.arch }}
      - name: Build signed installer
        env:
          UC_APP_PUBLIC_KEY: ${{ secrets.APP_UPDATE_PUBLIC_KEY }}
          UC_COMPONENT_PUBLIC_KEY: ${{ secrets.COMPONENT_UPDATE_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.APP_UPDATE_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.APP_UPDATE_KEY_PASSWORD }}
        run: npm run build:desktop
      - name: Stage updater manifest and installer
        env:
          UC_RELEASE_ARCH: ${{ matrix.arch }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.APP_UPDATE_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.APP_UPDATE_KEY_PASSWORD }}
        run: node scripts/stage-release.mjs
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: windows-${{ matrix.arch }}
          path: .cache/release-files/*
          if-no-files-found: error

  unix:
    needs: validate
    uses: ./.github/workflows/desktop-packages.yml
    with:
      release_tag: ${{ github.ref_name }}
    secrets: inherit

  android_media:
    needs: validate
    uses: ./.github/workflows/android-native-tools.yml

  android:
    needs: android_media
    uses: ./.github/workflows/android-apk.yml
    with:
      release_tag: ${{ github.ref_name }}

  publish:
    needs: [windows, unix, android]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: windows-*
          merge-multiple: true
          path: .cache/release-files
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: desktop-*
          merge-multiple: true
          path: .cache/release-files
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: UnlimitedClipper-android-arm64-preview-UNTESTED
          path: .cache/android-package
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          name: android-native-media-arm64
          path: .cache/android-native-tools
      - run: node scripts/stage-release.mjs --publish
        env:
          UC_RELEASE_DRAFT: '1'
          GH_TOKEN: ${{ github.token }}
