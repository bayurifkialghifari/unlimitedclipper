name: Native speech quality pack

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - run: pip install torch==2.8.0 torchaudio==2.8.0 --index-url https://download.pytorch.org/whl/cpu
      - run: pip install transformers==4.57.1 huggingface-hub==0.36.0 onnx==1.19.1 onnxruntime==1.23.2 numpy==2.2.6 speechbrain==1.0.3
      - run: python scripts/export-quality-pack.py
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: native-quality-pack
          path: |
            quality-pack.zip
            quality-pack/manifest.json
          compression-level: 0
          retention-days: 14
