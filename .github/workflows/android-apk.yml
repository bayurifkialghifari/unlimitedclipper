name: Android ARM64 preview APK

on:
  workflow_dispatch:
    inputs:
      media_run_id:
        description: Successful Android native media workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: false

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '2'
      GH_TOKEN: ${{ github.token }}
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '21'
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          toolchain: stable
          targets: aarch64-linux-android
          components: rustfmt, clippy
      - name: Prepare the SDK and inspected media dependency
        env:
          MEDIA_RUN_ID: ${{ inputs.media_run_id }}
        run: |
          [[ "$MEDIA_RUN_ID" =~ ^[0-9]+$ ]]
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'ndk;28.2.13676358' 'platforms;android-36' 'build-tools;36.0.0'
          gh run watch "$MEDIA_RUN_ID" --exit-status --interval 30
          gh run download "$MEDIA_RUN_ID" -n android-native-media-arm64 -D .cache/android-native-tools
      - run: npm ci
      - run: npm run check
      - run: npm run build:android
      - name: Inspect package, signature, ARM64 libraries, and 16 KB alignment
        run: python3 scripts/inspect-android-apk.py --apk-directory apps/desktop/src-tauri/gen/android/app/build/outputs/apk --output .cache/android-apk
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: UnlimitedClipper-android-arm64-preview-UNTESTED
          path: .cache/android-apk
          if-no-files-found: error
          retention-days: 30
      - name: Preserve failed package inspection diagnostics
        if: failure()
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4
        with:
          name: android-apk-failure-diagnostics
          path: |
            apps/desktop/src-tauri/gen/android/app/build/outputs/apk
            .cache/android-apk
          if-no-files-found: ignore
          retention-days: 7
